services:
  #------------------------------ DATABASE SERIVCE ------------------------------------#
  db_mp:
    image: mysql:9.6
    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PWD}
      MYSQL_USER: ${MYSQL_USR}
      MYSQL_PASSWORD: ${MYSQL_PWD}
    ports:
      - "3307:3306"
    volumes:
      - registration_mp_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
     - mp_network

  #---------------------------------- CATALOG SERVICE -----------------------------------------#

  catalog-db:
    image: mysql:9.1.0
    container_name: catalog-db
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CATALOG_ROOT_PWD}
      MYSQL_DATABASE: ${MTSQL_CATALOG_DB}
      MYSQL_USER: ${MYSQL_CATALOG_USER}
      MYSQL_PASSWORD: ${MYSQL_CATALOG_PWD}
    volumes:
      - catalog_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mp_network

  #---------------------------------- MONGO SERVICE -----------------------------------------#

  catalog-metadata-database:
    image: mongo:8.2
    ports:
      - "27018:27017"
    volumes:
      - metadata_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - mp_network

  #---------------------------------- CACHE SERVICE -----------------------------------------#
  catalog-cache:
    image: redis:8.6-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - mp_network

volumes:
  registration_mp_data:
  catalog_data:
  metadata_data:

networks:
  mp_network:
    driver: bridge