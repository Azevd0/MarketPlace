spring.application.name=MarketPlace
management.endpoint.health.show-details=always
spring.docker.compose.lifecycle-management=start-only
spring.jpa.show-sql=true
spring.threads.virtual.enabled=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

#================= Registration MySQL 3307 ====================

registration.datasource.url= jdbc:mysql://localhost:3307/${MYSQL_DB}
registration.datasource.username=${MYSQL_USR}
registration.datasource.password=${MYSQL_PWD}
registration.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
registration.jpa.properties.hibernate.hbm2ddl.auto=update

#=================== Catalog MySQL 3308 ========================

catalog.datasource.url=jdbc:mysql://localhost:3308/${MTSQL_CATALOG_DB}
catalog.datasource.username=${MYSQL_CATALOG_USER}
catalog.datasource.password=${MYSQL_CATALOG_PWD}
catalog.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
catalog.jpa.properties.hibernate.hbm2ddl.auto=update

#=================== MongoDB 3308 ========================

spring.mongodb.representation.uuid=standard

#=================== Redis 6380 ========================

spring.data.redis.client-type=jedis